generation:
  num_examples: 5000
  workers: 5
  temperature: 0.7
  max_tokens: 2048
  random_seed: 42
  # the study drew language and bug type independently
  sampling: uniform
validation:
  # the study neither retried nor filtered generations
  max_retries: 0
  min_code_lines: 0
  require_difference: false
evaluation:
  enabled: true
  temperature: 0.2
  max_output_tokens: 512
  workers: 5
  max_retries: 2
  random_seed: 42
selection:
  threshold: 8.5
  weight_config: balanced
