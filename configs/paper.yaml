# Setup of the companion study.
run_name: paper_pipeline
output_dir: synthetic_runs/paper_pipeline
models:
  - name: nvidia/Llama-3.1-Nemotron-70B-Instruct-HF
    run_name: llama31_nemotron_70b
    random_seed: 101
    base_url: http://localhost:8000/v1
    serve:
      require_launch: true
      port: 8000
      tensor_parallel_size: 2
      dtype: bfloat16
      gpu_memory_utilization: 0.9
      cuda_visible_devices: "0,1"
      log_file: synthetic_runs/logs/llama31_nemotron_70b_vllm.log
